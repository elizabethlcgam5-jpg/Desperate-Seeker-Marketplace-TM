openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Desperately Seeking - buyer-first marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profiles
  - name: requests
    description: Buyer requests
  - name: responses
    description: Seller responses
  - name: messages
    description: Conversation messages
  - name: stats
    description: Marketplace stats and feeds
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the currently active user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update profile of currently active user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (used for switching active user during demo)
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /me/subscribe:
    post:
      operationId: subscribeCurrentUser
      tags: [users]
      summary: Set the seller subscription tier for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier:
                  type: string
                  enum: [free, seller_basic, seller_pro, seller_annual]
      responses:
        "200":
          description: Updated user with new tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /me/analytics:
    get:
      operationId: getSellerAnalytics
      tags: [stats]
      summary: Seller analytics for the current user (Pro perk)
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerAnalytics"

  /pricing/plans:
    get:
      operationId: listPricingPlans
      tags: [users]
      summary: Public pricing plans for sellers
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricingPlan"

  /users/switch:
    post:
      operationId: switchUser
      tags: [users]
      summary: Switch the active user (demo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        "200":
          description: New current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user profile by id
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List buyer requests
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [open, fulfilled, closed]
        - in: query
          name: buyerId
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest, most_responses, urgent]
            default: newest
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestSummary"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create a buyer request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"

  /requests/{requestId}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get full detail of a buyer request including responses
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update status / details of a request (buyer only)
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequestBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"

  /requests/{requestId}/responses:
    get:
      operationId: listResponsesForRequest
      tags: [responses]
      summary: List seller responses for a request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerResponse"
    post:
      operationId: createResponse
      tags: [responses]
      summary: Submit a seller response with photos and price
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResponseBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerResponse"

  /responses/{responseId}:
    get:
      operationId: getResponse
      tags: [responses]
      summary: Get a response by id
      parameters:
        - in: path
          name: responseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerResponse"
    patch:
      operationId: updateResponseStatus
      tags: [responses]
      summary: Buyer accepts or declines a seller response
      parameters:
        - in: path
          name: responseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, accepted, declined]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerResponse"

  /threads:
    get:
      operationId: listThreads
      tags: [messages]
      summary: List conversation threads for the current user
      responses:
        "200":
          description: Threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Thread"

  /threads/{threadId}:
    get:
      operationId: getThread
      tags: [messages]
      summary: Get thread with messages
      parameters:
        - in: path
          name: threadId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thread detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"

  /threads/{threadId}/messages:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a thread
      parameters:
        - in: path
          name: threadId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /categories:
    get:
      operationId: listCategories
      tags: [stats]
      summary: List request categories with counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCount"

  /stats/overview:
    get:
      operationId: getOverviewStats
      tags: [stats]
      summary: Marketplace summary stats
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewStats"

  /feed/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Recent activity feed across the marketplace
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /feed/trending:
    get:
      operationId: getTrendingRequests
      tags: [stats]
      summary: Top trending requests right now
      responses:
        "200":
          description: Trending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestSummary"

  /me/inventory:
    get:
      operationId: listInventoryItems
      tags: [inventory]
      summary: List the current seller's inventory
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Add an item to the seller's inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /me/inventory/{itemId}:
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Remove an item from inventory
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /me/matches:
    get:
      operationId: getInventoryMatches
      tags: [inventory]
      summary: Match seller inventory against open buyer requests
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryMatch"

  /me/prospecting:
    get:
      operationId: getProspectingFeed
      tags: [stats]
      summary: Live feed of the 20 most recent buyer requests (seller view)
      responses:
        "200":
          description: Feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestSummary"

  /me/feedback:
    post:
      operationId: submitSellerFeedback
      tags: [users]
      summary: Submit marketplace feedback from a seller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSellerFeedbackBody"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerFeedback"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    User:
      type: object
      required:
        [id, name, handle, avatarUrl, joinedAt, bio, location, subscriptionTier]
      properties:
        id:
          type: string
        name:
          type: string
        handle:
          type: string
        avatarUrl:
          type: string
        joinedAt:
          type: string
          format: date-time
        bio:
          type: string
        location:
          type: string
        subscriptionTier:
          type: string
          enum: [free, seller_basic, seller_pro, seller_annual]
        subscriptionRenewsAt:
          type: string
          format: date-time
          nullable: true

    SellerAnalytics:
      type: object
      required:
        [
          totalOffers,
          totalViews,
          accepted,
          declined,
          pending,
          acceptanceRate,
          avgViewsPerOffer,
          recentOffers,
        ]
      properties:
        totalOffers:
          type: integer
        totalViews:
          type: integer
        accepted:
          type: integer
        declined:
          type: integer
        pending:
          type: integer
        acceptanceRate:
          type: number
        avgViewsPerOffer:
          type: number
        recentOffers:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsOffer"

    AnalyticsOffer:
      type: object
      required: [id, requestId, requestTitle, price, status, viewCount, createdAt]
      properties:
        id:
          type: string
        requestId:
          type: string
        requestTitle:
          type: string
        price:
          type: number
        status:
          type: string
          enum: [pending, accepted, declined]
        viewCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    PricingPlan:
      type: object
      required: [tier, name, priceCents, interval, tagline, features]
      properties:
        tier:
          type: string
          enum: [free, seller_basic, seller_pro, seller_annual]
        name:
          type: string
        priceCents:
          type: integer
        interval:
          type: string
          enum: [month, semi, year, none]
        tagline:
          type: string
        features:
          type: array
          items:
            type: string
        highlight:
          type: boolean

    InventoryItem:
      type: object
      required: [id, sellerId, title, category, style, condition, photos, isAvailable, createdAt]
      properties:
        id:
          type: string
        sellerId:
          type: string
        title:
          type: string
        category:
          type: string
        style:
          type: string
        description:
          type: string
        priceMin:
          type: number
          nullable: true
        priceMax:
          type: number
          nullable: true
        lengthIn:
          type: number
          nullable: true
        widthIn:
          type: number
          nullable: true
        heightIn:
          type: number
          nullable: true
        condition:
          type: string
          enum: [new, like_new, good, fair, used]
        photos:
          type: array
          items:
            type: string
        isAvailable:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateInventoryItemBody:
      type: object
      required: [title, category]
      properties:
        title:
          type: string
          minLength: 1
        category:
          type: string
        style:
          type: string
        description:
          type: string
        priceMin:
          type: number
        priceMax:
          type: number
        lengthIn:
          type: number
        widthIn:
          type: number
        heightIn:
          type: number
        condition:
          type: string
          enum: [new, like_new, good, fair, used]
        photos:
          type: array
          items:
            type: string

    InventoryMatch:
      type: object
      required: [inventoryItem, request, score, matchReasons]
      properties:
        inventoryItem:
          $ref: "#/components/schemas/InventoryItem"
        request:
          $ref: "#/components/schemas/RequestSummary"
        score:
          type: integer
          description: Match percentage 0-100
        matchReasons:
          type: array
          items:
            type: string

    CreateSellerFeedbackBody:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    SellerFeedback:
      type: object
      required: [id, sellerId, rating, createdAt]
      properties:
        id:
          type: string
        sellerId:
          type: string
        rating:
          type: integer
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    UserProfile:
      type: object
      required: [user, requestCount, responseCount, acceptedCount]
      properties:
        user:
          $ref: "#/components/schemas/User"
        requestCount:
          type: integer
        responseCount:
          type: integer
        acceptedCount:
          type: integer
        recentRequests:
          type: array
          items:
            $ref: "#/components/schemas/RequestSummary"

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        location:
          type: string
        avatarUrl:
          type: string

    RequestSummary:
      type: object
      required:
        [
          id,
          title,
          description,
          category,
          status,
          urgency,
          createdAt,
          buyer,
          responseCount,
          location,
          isPrivate,
        ]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        style:
          type: string
        budgetMin:
          type: number
          nullable: true
        budgetMax:
          type: number
          nullable: true
        lengthIn:
          type: number
          nullable: true
        widthIn:
          type: number
          nullable: true
        heightIn:
          type: number
          nullable: true
        photos:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [open, fulfilled, closed]
        urgency:
          type: string
          enum: [low, normal, high]
        location:
          type: string
        isPrivate:
          type: boolean
        createdAt:
          type: string
          format: date-time
        buyer:
          $ref: "#/components/schemas/User"
        responseCount:
          type: integer

    RequestDetail:
      allOf:
        - $ref: "#/components/schemas/RequestSummary"
        - type: object
          properties:
            tags:
              type: array
              items:
                type: string
            responses:
              type: array
              items:
                $ref: "#/components/schemas/SellerResponse"

    CreateRequestBody:
      type: object
      required: [title, description, category]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        category:
          type: string
        style:
          type: string
        budgetMin:
          type: number
        budgetMax:
          type: number
        lengthIn:
          type: number
        widthIn:
          type: number
        heightIn:
          type: number
        location:
          type: string
        urgency:
          type: string
          enum: [low, normal, high]
        tags:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            type: string
        isPrivate:
          type: boolean

    UpdateRequestBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, fulfilled, closed]
        urgency:
          type: string
          enum: [low, normal, high]

    SellerResponse:
      type: object
      required:
        [
          id,
          requestId,
          seller,
          price,
          condition,
          message,
          photos,
          status,
          viewCount,
          createdAt,
        ]
      properties:
        id:
          type: string
        requestId:
          type: string
        seller:
          $ref: "#/components/schemas/User"
        price:
          type: number
        condition:
          type: string
          enum: [new, like_new, good, fair, used]
        message:
          type: string
        photos:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, accepted, declined]
        threadId:
          type: string
          nullable: true
        viewCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateResponseBody:
      type: object
      required: [price, condition, message, photos]
      properties:
        price:
          type: number
        condition:
          type: string
          enum: [new, like_new, good, fair, used]
        message:
          type: string
          minLength: 1
        photos:
          type: array
          items:
            type: string

    Thread:
      type: object
      required:
        [id, requestId, requestTitle, otherUser, lastMessage, updatedAt, unread]
      properties:
        id:
          type: string
        requestId:
          type: string
        requestTitle:
          type: string
        otherUser:
          $ref: "#/components/schemas/User"
        lastMessage:
          type: string
        updatedAt:
          type: string
          format: date-time
        unread:
          type: integer

    ThreadDetail:
      type: object
      required: [id, request, participants, messages]
      properties:
        id:
          type: string
        request:
          $ref: "#/components/schemas/RequestSummary"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/User"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    Message:
      type: object
      required: [id, threadId, sender, body, createdAt]
      properties:
        id:
          type: string
        threadId:
          type: string
        sender:
          $ref: "#/components/schemas/User"
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category:
          type: string
        count:
          type: integer

    OverviewStats:
      type: object
      required:
        [
          openRequests,
          totalResponses,
          fulfilledThisWeek,
          activeBuyers,
          activeSellers,
        ]
      properties:
        openRequests:
          type: integer
        totalResponses:
          type: integer
        fulfilledThisWeek:
          type: integer
        activeBuyers:
          type: integer
        activeSellers:
          type: integer

    ActivityEvent:
      type: object
      required: [id, kind, createdAt, actor, summary]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [request_created, response_created, response_accepted, request_fulfilled]
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/User"
        summary:
          type: string
        requestId:
          type: string
          nullable: true
